<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Busca por assunto · G1</title>
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
    <div class="loading-overlay" id="loading-overlay" aria-live="polite">
        <div class="loading-card">
            <div class="spinner" aria-hidden="true"></div>
            Carregando resultados…
        </div>
    </div>

    <div class="page">
        <header class="page-header">
            <h1>Busca por assunto</h1>
            <p class="page-subtitle">busca híbrida + reordenação PPR sobre o acervo do G1</p>
        </header>

        <div class="layout">
            <aside class="sidebar">
                <form class="search-form" id="search-form">
                    <div class="field">
                        <label for="query">Assunto</label>
                        <input type="text" id="query" name="query" placeholder="Ex.: guerra Irã Estados Unidos" required>
                    </div>
                    <div class="field-row">
                        <div class="field">
                            <label for="limit">Limite</label>
                            <input type="number" id="limit" name="limit" min="1" placeholder="100">
                        </div>
                        <div class="field">
                            <label for="top_k">Top K (busca)</label>
                            <input type="number" id="top_k" name="top_k" min="1" placeholder="opcional">
                        </div>
                    </div>
                    <div class="field-row">
                        <div class="field">
                            <label for="date_from">De</label>
                            <input type="date" id="date_from" name="date_from">
                        </div>
                        <div class="field">
                            <label for="date_to">Até</label>
                            <input type="date" id="date_to" name="date_to">
                        </div>
                    </div>
                    <button type="submit" class="btn-primary">Buscar</button>
                    <p class="form-hint">Limite e Top K controlam a recuperação híbrida; o período restringe as datas de publicação.</p>
                </form>
            </aside>

            <main class="main">
                <div class="error-banner" id="error-banner" hidden>
                    <span id="error-text"></span>
                    <button type="button" class="error-close" id="error-close" aria-label="Fechar erro">×</button>
                </div>

                <div class="tabs" role="tablist" aria-label="Visualizações">
                    <button class="tab-button active" type="button" role="tab" data-tab="panel-timeline" aria-selected="true">Linha do tempo</button>
                    <button class="tab-button" type="button" role="tab" data-tab="panel-graph" aria-selected="false">Grafo de entidades</button>
                </div>

                <section class="tab-panel active" id="panel-timeline" role="tabpanel">
                    <div class="stat-strip" id="stat-strip" hidden>
                        <div class="stat">
                            <div class="stat-value" id="stat-count">—</div>
                            <div class="stat-label">Artigos</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value" id="stat-span">—</div>
                            <div class="stat-label">Período</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value" id="stat-avg">—</div>
                            <div class="stat-label">PPR médio</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value" id="stat-entities">—</div>
                            <div class="stat-label">Entidades</div>
                        </div>
                    </div>

                    <div class="toolbar" id="timeline-toolbar" hidden>
                        <div class="toolbar-group">
                            <label for="sort-select">Ordenar por</label>
                            <select id="sort-select">
                                <option value="date_desc">Data · mais recentes</option>
                                <option value="date_asc">Data · mais antigas</option>
                                <option value="ppr_desc">Score PPR</option>
                            </select>
                        </div>
                        <div class="toolbar-group">
                            <label for="top-n">Top N por score</label>
                            <input type="number" id="top-n" min="1" step="1">
                            <button type="button" class="btn-ghost" id="top-n-all">todos</button>
                        </div>
                        <div class="toolbar-group" id="entity-chip-slot"></div>
                    </div>

                    <div class="timeline" id="timeline"></div>
                </section>

                <section class="tab-panel" id="panel-graph" role="tabpanel">
                    <div class="graph-layout">
                        <div class="graph-card">
                            <div class="graph-controls">
                                <label>
                                    <input type="checkbox" id="only-articles">
                                    Só artigos (arestas por entidades compartilhadas)
                                </label>
                            </div>
                            <div id="graph" class="graph-container"></div>
                            <div id="graph-tooltip" class="graph-tooltip" role="tooltip"></div>
                            <div class="graph-legend" id="graph-legend"></div>
                        </div>
                        <div class="entity-table-card">
                            <h3>Entidades</h3>
                            <div class="entity-table-scroll">
                                <table>
                                    <thead>
                                        <tr>
                                            <th>Entidade</th>
                                            <th class="num-cell">PPR</th>
                                            <th class="num-cell">Grau</th>
                                        </tr>
                                    </thead>
                                    <tbody id="entity-table-body"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script type="module" src="/static/js/app.js"></script>
</body>
</html>
